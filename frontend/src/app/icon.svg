  <path d="M19 49 L12 62 L29 51 Z" fill="#111"/>
  <!-- đuôi bong bóng -->
  <path d="M15 45 L8 58 L25 47 Z" fill="#111"/>
  <!-- bong bóng -->
  <rect x="5.5" y="4.5" width="50" height="44" rx="12" fill="#FFD43B" stroke="#111" stroke-width="5"/>
  <!-- mắt: vòng tròn -->

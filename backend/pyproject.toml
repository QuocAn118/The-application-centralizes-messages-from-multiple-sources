[project]
name = "omnichat-backend"
version = "0.1.0"
description = "OmniChat — hệ thống tập trung tin nhắn đa kênh"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-json-logger>=3.2",
    "uuid-utils>=0.10",
    "email-validator>=2.3.0",
    "cryptography>=49.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    "integration: test cần cơ sở dữ liệu thật",
    "e2e: test đi qua toàn bộ API",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "I001", "UP007", "UP035"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.coverage.run]
source = ["src"]
omit = [
    "src/main.py",
    # Interface repository và port chỉ là Protocol với thân ``...`` — không có
    # logic để test và không bao giờ được khởi tạo, nên đo coverage chúng vô
    # nghĩa và kéo tụt con số một cách giả tạo.
    "src/modules/*/domain/repositories/*.py",
    "src/modules/*/application/ports.py",
    "src/modules/*/domain/ports.py",
]

[tool.importlinter]
root_package = "src"
# Bắt buộc khi contract cấm import gói ngoài (sqlalchemy, fastapi, pydantic).
# Thiếu dòng này, import-linter báo lỗi cấu hình thay vì kiểm tra contract.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain khong duoc phu thuoc tang ngoai"
type = "forbidden"
source_modules = [
    "src.shared.domain",
    "src.modules.identity.domain",
    "src.modules.inbox.domain",
    "src.modules.hrm.domain",
]
forbidden_modules = [
    "src.shared.infrastructure",
    "src.modules.identity.infrastructure",
    "src.modules.identity.presentation",
    "src.modules.inbox.infrastructure",
    "src.modules.inbox.presentation",
    "src.modules.hrm.infrastructure",
    "src.modules.hrm.presentation",
    "sqlalchemy",
    "fastapi",
    "pydantic",
]

[[tool.importlinter.contracts]]
name = "Application khong duoc phu thuoc infrastructure va presentation"
type = "forbidden"
source_modules = [
    "src.shared.application",
    "src.modules.identity.application",
    "src.modules.inbox.application",
    "src.modules.hrm.application",
]
forbidden_modules = [
    "src.shared.infrastructure",
    "src.modules.identity.infrastructure",
    "src.modules.identity.presentation",
    "src.modules.inbox.infrastructure",
    "src.modules.inbox.presentation",
    "src.modules.hrm.infrastructure",
    "src.modules.hrm.presentation",
    "sqlalchemy",
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "Cac layer identity tuan thu thu tu mot chieu"
type = "layers"
layers = [
    "src.modules.identity.presentation",
    "src.modules.identity.infrastructure",
    "src.modules.identity.application",
    "src.modules.identity.domain",
]

[[tool.importlinter.contracts]]
name = "Cac layer inbox tuan thu thu tu mot chieu"
type = "layers"
layers = [
    "src.modules.inbox.presentation",
    "src.modules.inbox.infrastructure",
    "src.modules.inbox.application",
    "src.modules.inbox.domain",
]

[[tool.importlinter.contracts]]
name = "inbox va identity doc lap - chi noi qua UUID va port"
type = "forbidden"
# inbox domain/application/presentation KHONG duoc cham identity. Chi
# inbox.infrastructure (implementation cua IWorkforceDirectory) moi duoc phep,
# nen khong liet ke o day.
source_modules = [
    "src.modules.inbox.domain",
    "src.modules.inbox.application",
    "src.modules.inbox.presentation",
]
forbidden_modules = ["src.modules.identity"]

[[tool.importlinter.contracts]]
name = "Cac layer hrm tuan thu thu tu mot chieu"
type = "layers"
layers = [
    "src.modules.hrm.presentation",
    "src.modules.hrm.infrastructure",
    "src.modules.hrm.application",
    "src.modules.hrm.domain",
]

[[tool.importlinter.contracts]]
name = "hrm doc lap voi identity va inbox - chi noi qua UUID va port"
type = "forbidden"
# hrm domain/application/presentation KHONG duoc cham identity lan inbox. Chi
# hrm.infrastructure (implementation IWorkforceDirectory, IPerformanceSource)
# moi duoc phep, nen khong liet ke o day.
source_modules = [
    "src.modules.hrm.domain",
    "src.modules.hrm.application",
    "src.modules.hrm.presentation",
]
forbidden_modules = [
    "src.modules.identity",
    "src.modules.inbox",
]
